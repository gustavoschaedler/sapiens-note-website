server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Inherits the default mime.types (css->text/css, js->text/javascript, etc.)
    # — important: ES modules (Three.js) need a JS mime. .3mf has no default type
    # and is served as application/octet-stream, which the ThreeMFLoader handles
    # fine (it reads the response as an ArrayBuffer).

    # gzip for text assets
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;

    # long cache for fingerprint-free static assets
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|css|js|3mf)$ {
        expires     7d;
        add_header  Cache-Control "public";
        try_files   $uri =404;
    }

    # SPA-style fallback (single page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # don't serve dotfiles
    location ~ /\. { deny all; }
}
